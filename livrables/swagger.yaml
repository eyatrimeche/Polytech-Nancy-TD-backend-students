openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: API de gestion d'une TODO List.
servers:
    -   url: http://localhost:8080
        description: Serveur local de développement

tags:
    -   name: tasks
        description: Opérations sur les tâches

paths:
    /tasks:
        post:
            tags: [ tasks ]
            summary: Créer une tâche
            operationId: createTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TasksRequestDto'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            description: URL de la ressource créée
                            schema:
                                type: string
                                example: /tasks/1
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TasksResponseDto'
                '400':
                    description: Données invalides (titre manquant/trop long ou description trop longue)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationErrorDto'
        get:
            tags: [ tasks ]
            summary: Récupérer toutes les tâches
            operationId: getAllTasks
            parameters:
                -   in: query
                    name: todo-only
                    required: false
                    schema:
                        type: boolean
            responses:
                '200':
                    description: Liste des tâches
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TasksResponseDto'
                '204':
                    description: Aucune tâche trouvée

    /tasks/{id}:
        parameters:
            -   in: path
                name: id
                required: true
                description: Identifiant numérique de la tâche
                schema:
                    type: integer
                    minimum: 1
        get:
            tags: [ tasks ]
            summary: Récupérer une tâche
            description: Récupérer une tâche par son identifiant
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TasksResponseDto'
                '404':
                    description: Tâche non trouvée
        put:
            tags: [ tasks ]
            summary: Modifier une tâche
            operationId: updateTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TasksUpdateRequestDto'
            responses:
                '204':
                    description: Tâche mise à jour avec succès
                '400':
                    description: Données invalides (titre manquant/trop long ou description trop longue)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationErrorDto'
                '404':
                    description: Tâche non trouvée
        delete:
            tags: [ tasks ]
            summary: Supprimer une tâche
            operationId: deleteTask
            responses:
                '204':
                    description: Tâche supprimée avec succès
                '404':
                    description: Tâche non trouvée

components:
    schemas:
        TasksRequestDto:
            type: object
            description: Données requises pour créer une tâche
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    nullable: true
                    example: 2L demi-écrémé
            required:
                - title

        TasksUpdateRequestDto:
            type: object
            description: Données requises pour modifier une tâche
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: true
            required:
                - title
                - done

        TasksResponseDto:
            type: object
            description: Représentation d'une tâche renvoyée par l'API
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false
            required:
                - id
                - title
                - done

        ValidationErrorDto:
            type: object
            description: Détail d'une erreur de validation (Code 400)
            properties:
                field:
                    type: string
                    example: title
                description:
                    type: string
                    example: Title size maximum is 50 characters
            required:
                - field
                - description